# =========================================================
# HTTP → HTTPS REDIRECT
# =========================================================
server {
    listen 80;
    server_name iic.mnnit.ac.in;

    server_tokens off;

    return 301 https://iic.mnnit.ac.in$request_uri;
}


# =========================================================
# HTTPS PRODUCTION SERVER
# =========================================================
server {
    listen 443 ssl;
    server_name iic.mnnit.ac.in;

    server_tokens off;

    # -----------------------------------------------------
    # SSL
    # -----------------------------------------------------
    ssl_certificate     /etc/letsencrypt/live/iic.mnnit.ac.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/iic.mnnit.ac.in/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    # -----------------------------------------------------
    # FRONTEND
    # -----------------------------------------------------
    location / {
        proxy_pass http://client:80;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -----------------------------------------------------
    # BACKEND API
    # -----------------------------------------------------
    location /api/ {
        proxy_pass http://server1:5001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # -----------------------------------------------------
    # API DOCUMENTATION
    # -----------------------------------------------------
    location /docs {
        proxy_pass http://server1:5001;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}