version: "3.9"

services:

  # =========================================================
  # PRODUCTION NGINX GATEWAY
  # =========================================================
  gateway:
    image: nginx:alpine

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro

    depends_on:
      - client
      - server1

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    networks:
      - renaissance-network


  # =========================================================
  # RENAISSANCE BACKEND
  # =========================================================
  server1:
    build:
      context: .
      dockerfile: Dockerfile
      target: server1

      args:
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}

    image: ${SERVER1_IMAGE:-krnaman/renaissance-server1:latest}

    env_file:
      - ./RENAISSANCE-ECELL-2026/server1/.env

    environment:
      NODE_ENV: production
      PORT: "5001"

    restart: unless-stopped

    init: true

    read_only: true

    tmpfs:
      - /tmp:size=64m,mode=1777

    security_opt:
      - no-new-privileges:true

    cap_drop:
      - ALL

    stop_grace_period: 15s

    networks:
      - renaissance-network


  # =========================================================
  # RENAISSANCE FRONTEND
  # =========================================================
  client:
    build:
      context: .
      dockerfile: Dockerfile
      target: client

      args:
        VITE_SERVER1_API_URL: ${VITE_SERVER1_API_URL:-https://iic.mnnit.ac.in/api/v1}
        HTTP_PROXY: ${HTTP_PROXY}
        HTTPS_PROXY: ${HTTPS_PROXY}
        NO_PROXY: ${NO_PROXY}

    image: ${CLIENT_IMAGE:-krnaman/iic-web-client:latest}

    depends_on:
      server1:
        condition: service_healthy

    restart: unless-stopped

    security_opt:
      - no-new-privileges:true

    networks:
      - renaissance-network


  # =========================================================
  # OLD BACKEND
  # =========================================================
  old-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    image: ${OLD_BACKEND_IMAGE:-krnaman/old-backend:latest}
    ports:
      - "7000:7000"
    environment:
      NODE_ENV: production
      PORT: "7000"
    restart: unless-stopped
    networks:
      - renaissance-network


  # =========================================================
  # OLD FRONTEND
  # =========================================================
  old-frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    image: ${OLD_FRONTEND_IMAGE:-krnaman/old-frontend:latest}
    ports:
      - "8080:80"
    depends_on:
      - old-backend
    restart: unless-stopped
    networks:
      - renaissance-network


# =========================================================
# NETWORK
# =========================================================
networks:
  renaissance-network:
    driver: bridge